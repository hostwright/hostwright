name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: Guest/HostwrightNetfilter/go.mod
          cache-dependency-path: Guest/HostwrightNetfilter/go.sum
      - name: Guest network-policy loader
        shell: bash
        run: |
          set -euo pipefail
          cd Guest/HostwrightNetfilter
          test -z "$(gofmt -l .)"
          GOTOOLCHAIN=local go test ./...
          GOTOOLCHAIN=local GOOS=linux GOARCH=arm64 CGO_ENABLED=0 \
            go test -c -mod=readonly -trimpath \
            -o "$RUNNER_TEMP/hostwright-netfilter-tests"
          for build in first second; do
            GOTOOLCHAIN=local GOOS=linux GOARCH=arm64 CGO_ENABLED=0 \
              go build -mod=readonly -trimpath -buildvcs=false \
              -ldflags="-buildid= -s -w" \
              -o "$RUNNER_TEMP/hostwright-netfilter-$build" .
          done
          cmp \
            "$RUNNER_TEMP/hostwright-netfilter-first" \
            "$RUNNER_TEMP/hostwright-netfilter-second"
          file "$RUNNER_TEMP/hostwright-netfilter-first" \
            | grep -F "ELF 64-bit LSB executable, ARM aarch64"
          (
            cd "$RUNNER_TEMP"
            shasum -a 256 hostwright-netfilter-first \
              >hostwright-netfilter-linux-arm64.sha256
          )
      - name: Retain guest policy loader for live qualification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hostwright-netfilter-linux-arm64
          path: |
            ${{ runner.temp }}/hostwright-netfilter-first
            ${{ runner.temp }}/hostwright-netfilter-linux-arm64.sha256
          retention-days: 1
          if-no-files-found: error
      - name: Pull-request regression gate
        shell: bash
        env:
          HOSTWRIGHT_TEST_RESULTS_DIR: ${{ runner.temp }}/hostwright-test-results
        run: |
          set -euo pipefail
          mkdir -p "$HOSTWRIGHT_TEST_RESULTS_DIR"
          scripts/test.sh pr 2>&1 \
            | tee "$HOSTWRIGHT_TEST_RESULTS_DIR/pr.log"
      - name: Retain pull-request logs and results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hostwright-test-results
          retention-days: 7
          if-no-files-found: warn
