name: Authenticated kernel source ingredient

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  kernel-source:
    name: Verify and attest Linux 6.18.55 source
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out the exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Authenticate the upstream source archive
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = hostwright/hostwright
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          root="$RUNNER_TEMP/kernel-source-ingredient"
          mkdir -m 700 "$root"
          cp scripts/release/keys/gregkh-pinned-public-key.asc "$root/"
          cd "$root"
          printf '%s  %s\n' \
            d3494056bb1a9726366499d790dfd44555d9f6e354cd4549143bf9c0b7ccb99c \
            gregkh-pinned-public-key.asc | sha256sum --check --status
          for name in linux-6.18.55.tar.xz linux-6.18.55.tar.sign; do
            curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' --tlsv1.2 \
              --output "$name" "https://cdn.kernel.org/pub/linux/kernel/v6.x/$name"
          done
          cp "$GITHUB_WORKSPACE"/scripts/release/patches/kernel-security/*.patch .
          printf '%s  %s\n' \
            f410638061a165c12f42ab871d2f3fcd525515359b5faeee80969cff84524df9 linux-6.18.55.tar.xz \
            aa93b6e27580a1c9abb15fe97c4bbe9d0b5f997c92a0b7682e9dae7654494cda linux-6.18.55.tar.sign \
            0f623a1cd2d3c46d190070dbc33ab41dd5168b976f9847dde88da102623ecb8d 0001-conntrack-expectation-lifetime.patch \
            c5b5d51fcfd49edd3d741898c5a188a1004c1e8197d7ce26fded6b2aa9138cb0 0002-bpf-backtracking-frame.patch \
            | sha256sum --check --status
          python3 "$GITHUB_WORKSPACE/scripts/release/verify-kernel-source-signature.py" \
            --kernel-version 6.18.55 --inputs "$root" --output "$root/signature-receipt.json"
          sha256sum linux-6.18.55.tar.xz linux-6.18.55.tar.sign *.patch \
            gregkh-pinned-public-key.asc signature-receipt.json \
            > checksums.sha256
          test -z "$(git -C "$GITHUB_WORKSPACE" status --porcelain=v1 --untracked-files=all)"
      - name: Attest the source and verification inputs
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/kernel-source-ingredient/linux-6.18.55.tar.xz
            ${{ runner.temp }}/kernel-source-ingredient/linux-6.18.55.tar.sign
            ${{ runner.temp }}/kernel-source-ingredient/*.patch
            ${{ runner.temp }}/kernel-source-ingredient/gregkh-pinned-public-key.asc
            ${{ runner.temp }}/kernel-source-ingredient/signature-receipt.json
            ${{ runner.temp }}/kernel-source-ingredient/checksums.sha256
      - name: Retain the authenticated source ingredient
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kernel-source-${{ github.sha }}
          path: ${{ runner.temp }}/kernel-source-ingredient/
          retention-days: 30
          if-no-files-found: error
