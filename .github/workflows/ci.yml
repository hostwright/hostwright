name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Select pull-request checks
        id: check-scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          run_regression=true
          if [[ "$EVENT_NAME" == pull_request ]] && [[ -n "$BASE_SHA" && -n "$HEAD_SHA" ]]; then
            if changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")" && [[ -n "$changed_files" ]]; then
              run_regression=false
              while IFS= read -r file; do
                case "$file" in
                  README.md|AGENTS.md|CHANGELOG.md|CONTRIBUTING.md|docs/*|ThirdPartyLicenses/*) ;;
                  *) run_regression=true; break ;;
                esac
              done <<< "$changed_files"
            fi
          fi
          printf 'run_regression=%s\n' "$run_regression" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == pull_request ]] && [[ -n "$BASE_SHA" && -n "$HEAD_SHA" ]]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git diff --check
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.check-scope.outputs.run_regression == 'true'
        with:
          go-version-file: Guest/HostwrightNetfilter/go.mod
          cache-dependency-path: Guest/HostwrightNetfilter/go.sum
      - name: Guest network-policy loader
        if: steps.check-scope.outputs.run_regression == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd Guest/HostwrightNetfilter
          test -z "$(gofmt -l .)"
          GOTOOLCHAIN=local go test ./...
          GOTOOLCHAIN=local GOOS=linux GOARCH=arm64 CGO_ENABLED=0 \
            go test -c -mod=readonly -trimpath \
            -o "$RUNNER_TEMP/hostwright-netfilter-tests"
          for build in first second; do
            GOTOOLCHAIN=local GOOS=linux GOARCH=arm64 CGO_ENABLED=0 \
              go build -mod=readonly -trimpath -buildvcs=false \
              -ldflags="-buildid= -s -w" \
              -o "$RUNNER_TEMP/hostwright-netfilter-$build" .
          done
          cmp \
            "$RUNNER_TEMP/hostwright-netfilter-first" \
            "$RUNNER_TEMP/hostwright-netfilter-second"
          file "$RUNNER_TEMP/hostwright-netfilter-first" \
            | grep -F "ELF 64-bit LSB executable, ARM aarch64"
          (
            cd "$RUNNER_TEMP"
            shasum -a 256 hostwright-netfilter-first \
              >hostwright-netfilter-linux-arm64.sha256
          )
      - name: Retain guest policy loader for live qualification
        if: steps.check-scope.outputs.run_regression == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hostwright-netfilter-linux-arm64
          path: |
            ${{ runner.temp }}/hostwright-netfilter-first
            ${{ runner.temp }}/hostwright-netfilter-linux-arm64.sha256
          retention-days: 1
          if-no-files-found: error
      - name: Pull-request regression gate
        if: steps.check-scope.outputs.run_regression == 'true'
        shell: bash
        env:
          HOSTWRIGHT_TEST_RESULTS_DIR: ${{ runner.temp }}/hostwright-test-results
        run: |
          set -euo pipefail
          mkdir -p "$HOSTWRIGHT_TEST_RESULTS_DIR"
          scripts/test.sh pr 2>&1 \
            | tee "$HOSTWRIGHT_TEST_RESULTS_DIR/pr.log"
      - name: Retain pull-request logs and results
        if: ${{ always() && steps.check-scope.outputs.run_regression == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hostwright-test-results
          retention-days: 7
          if-no-files-found: warn
