name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  latest-macos-build:
    runs-on: xcode-27
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify latest macOS toolchain environment
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(sw_vers -productVersion)" == 27.* ]]
          [[ "$(uname -m)" == arm64 ]]
          xcodebuild -version
          swift --version
      - name: Build the package and exercise the Docker proxy process
        shell: bash
        run: |
          set -euo pipefail
          swift build --jobs 1
          python3 scripts/test-docker-proxy.py "$(swift build --show-bin-path)/hostwright-docker-proxy"

  test:
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Select pull-request checks
        id: check-scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          run_regression=true
          if [[ "$EVENT_NAME" == pull_request || "$EVENT_NAME" == push ]] && [[ -n "$BASE_SHA" && -n "$HEAD_SHA" ]]; then
            if changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")" && [[ -n "$changed_files" ]]; then
              run_regression=false
              while IFS= read -r file; do
                case "$file" in
                  README.md|AGENTS.md|CHANGELOG.md|CONTRIBUTING.md|docs/*|ThirdPartyLicenses/*) ;;
                  *) run_regression=true; break ;;
                esac
              done <<< "$changed_files"
            fi
          fi
          printf 'run_regression=%s\n' "$run_regression" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == pull_request || "$EVENT_NAME" == push ]] \
            && [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] \
            && [[ "$BASE_SHA" != 0000000000000000000000000000000000000000 ]] \
            && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null \
            && git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git diff --check
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.check-scope.outputs.run_regression == 'true'
        with:
          go-version: 1.26.5
          cache-dependency-path: Guest/HostwrightNetfilter/go.sum
      - name: Guest network-policy loader
        if: steps.check-scope.outputs.run_regression == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd Guest/HostwrightNetfilter
          test -z "$(gofmt -l .)"
          GOTOOLCHAIN=local go test ./...
          GOTOOLCHAIN=local GOOS=linux GOARCH=arm64 CGO_ENABLED=0 \
            go test -c -mod=readonly -trimpath \
            -o "$RUNNER_TEMP/hostwright-netfilter-tests"
          for build in first second; do
            GOTOOLCHAIN=local GOOS=linux GOARCH=arm64 CGO_ENABLED=0 \
              go build -mod=readonly -trimpath -buildvcs=false \
              -gcflags=all=-buildid= \
              -ldflags="-buildid= -s -w" \
              -o "$RUNNER_TEMP/hostwright-netfilter-$build" .
          done
          cmp \
            "$RUNNER_TEMP/hostwright-netfilter-first" \
            "$RUNNER_TEMP/hostwright-netfilter-second"
          file "$RUNNER_TEMP/hostwright-netfilter-first" \
            | grep -F "ELF 64-bit LSB executable, ARM aarch64"
          (
            cd "$RUNNER_TEMP"
            shasum -a 256 hostwright-netfilter-first \
              >hostwright-netfilter-linux-arm64.sha256
          )
      - name: Retain guest policy loader for live qualification
        if: steps.check-scope.outputs.run_regression == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hostwright-netfilter-linux-arm64
          path: |
            ${{ runner.temp }}/hostwright-netfilter-first
            ${{ runner.temp }}/hostwright-netfilter-linux-arm64.sha256
          retention-days: 1
          if-no-files-found: error
      - name: Pull-request regression gate
        if: steps.check-scope.outputs.run_regression == 'true'
        shell: bash
        env:
          HOSTWRIGHT_TEST_RESULTS_DIR: ${{ runner.temp }}/hostwright-test-results
        run: |
          set -euo pipefail
          mkdir -p "$HOSTWRIGHT_TEST_RESULTS_DIR"
          scripts/test.sh pr 2>&1 \
            | tee "$HOSTWRIGHT_TEST_RESULTS_DIR/pr.log"
      - name: Retain pull-request logs and results
        if: ${{ always() && steps.check-scope.outputs.run_regression == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hostwright-test-results
          retention-days: 7
          if-no-files-found: warn

  runtime-provenance:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: false
      - name: Verify source and build evidence capture
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang lld llvm ninja-build strace
          python3 scripts/release/test-capture-runtime-source.py
          python3 scripts/release/test-capture-linux-runtime-source.py
          python3 scripts/release/test-capture-package-sources.py
          python3 scripts/release/test-capture-go-runtime-sources.py
          python3 scripts/release/test-capture-go-build.py
          python3 scripts/release/test-prepare-go-runtime-provenance.py
          python3 scripts/release/test-capture-native-runtime-build.py
          python3 scripts/release/test-capture-native-source-map.py
          python3 scripts/release/test-capture-native-patches.py
          python3 scripts/release/test-capture-swift-sdk-build-inputs.py
          python3 scripts/release/test-capture-sdk-object-sources.py
          python3 scripts/release/test-sdk-build-checkpoint.py
          python3 scripts/release/test-sdk-checkpoint-workflow.py
          python3 scripts/release/test-verify-sdk-reuse.py
          python3 scripts/release/test-recover-sdk-object-sources.py
          python3 scripts/release/test-prepare-native-source-projects.py
          python3 scripts/release/test-prepare-reviewed-native-sources.py
          python3 scripts/release/test-prepare-native-runtime-provenance.py
          python3 scripts/release/test-prepare-runtime-provenance.py
          python3 scripts/release/test-runtime-provenance.py
          python3 scripts/release/test-assemble-runtime-provenance.py
          python3 scripts/release/test-create-runtime-rootfs.py
          python3 scripts/release/test-create-runtime-oci.py
          python3 scripts/release/test-prepare-runtime-attestation-subjects.py
          python3 scripts/release/test-materialize-runtime-assets.py
          python3 scripts/release/test-qualify-runtime-inventory.py
          python3 scripts/release/test-corresponding-source.py
          python3 scripts/release/test-stage-corresponding-source.py
