version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      codeql-action:
        patterns:
          - github/codeql-action
          - github/codeql-action/*
  - package-ecosystem: gomod
    directory: /Guest/HostwrightNetfilter
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
