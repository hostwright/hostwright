name: Promote trusted release
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact staged source already merged to main
        required: true
        type: string
      version:
        description: Exact staged version
        required: true
        type: string
      tag:
        description: Exact unused immutable tag
        required: true
        type: string
      stage_run:
        description: Successful trusted stage workflow run ID
        required: true
        type: string
      stage_attempt:
        description: Exact stage run attempt
        required: true
        type: string
      qualification_run:
        description: Successful protected qualification acceptance run ID
        required: true
        type: string
permissions: {}
concurrency:
  group: trusted-release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:

  publish:
    name: Publish and verify immutable prerelease
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, macOS, ARM64, hostwright-release]
    environment: release
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_COMMIT: ${{ inputs.commit }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_TAG: ${{ inputs.tag }}
      STAGE_RUN: ${{ inputs.stage_run }}
      STAGE_ATTEMPT: ${{ inputs.stage_attempt }}
      RELEASE_GPG: ${{ vars.RELEASE_GPG }}
      RELEASE_GPG_SHA256: ${{ vars.RELEASE_GPG_SHA256 }}
      QUALIFICATION_RUN: ${{ inputs.qualification_run }}
      RELEASE_TEAM_ID: ${{ vars.RELEASE_TEAM_ID }}
    steps:
      - name: Check out protected workflow tools only
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify existing protected release environment
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/environments/release" > "$RUNNER_TEMP/release-policy.json"
          gh api "repos/$GITHUB_REPOSITORY/environments/release/deployment-branch-policies" > "$RUNNER_TEMP/release-branches.json"
          python3 scripts/release/validate-protection.py "$RUNNER_TEMP/release-policy.json" "$RUNNER_TEMP/release-branches.json"
      - name: Verify successful trusted stage and acceptance runs
        shell: bash
        run: |
          set -euo pipefail
          for value in "$STAGE_RUN" "$STAGE_ATTEMPT" "$QUALIFICATION_RUN"; do [[ "$value" =~ ^[1-9][0-9]*$ ]]; done
          python3 scripts/release/staged-release.py version --version "$RELEASE_VERSION"
          [[ "$RELEASE_TAG" == "v$RELEASE_VERSION" ]]
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STAGE_RUN" > "$RUNNER_TEMP/stage-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFICATION_RUN" > "$RUNNER_TEMP/qualification-run.json"
          python3 scripts/release/validate-run.py "$RUNNER_TEMP/stage-run.json" trusted-release.yml "$STAGE_ATTEMPT"
          python3 scripts/release/validate-run.py "$RUNNER_TEMP/qualification-run.json" release-qualification-acceptance.yml
      - name: Recheck immutable publication inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = hostwright/hostwright
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release tag now exists; tags are immutable." >&2
            exit 65
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release now exists; refusing duplicate publication." >&2
            exit 65
          fi

      - name: Download the attested release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hostwright-${{ inputs.version }}-trusted-release
          github-token: ${{ github.token }}
          run-id: ${{ inputs.stage_run }}
          path: ${{ runner.temp }}/hostwright-publish-bundle

      - name: Download authenticated aggregate receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hostwright-promotion-receipt
          github-token: ${{ github.token }}
          run-id: ${{ inputs.qualification_run }}
          path: ${{ runner.temp }}/qualification
      - name: Authenticate receipt and exact staged inventory
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/qualification/promotion-receipt.json"
          qualification_digest="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["head_sha"])' "$RUNNER_TEMP/qualification-run.json")"
          stage_digest="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["head_sha"])' "$RUNNER_TEMP/stage-run.json")"
          bundle="$RUNNER_TEMP/hostwright-publish-bundle"
          gh attestation verify "$receipt" --repo "$GITHUB_REPOSITORY" --signer-workflow hostwright/hostwright/.github/workflows/release-qualification-acceptance.yml --signer-digest "$qualification_digest" --source-ref refs/heads/main --deny-self-hosted-runners
          gh attestation verify "$bundle/stage-inventory.json" --repo "$GITHUB_REPOSITORY" --signer-workflow hostwright/hostwright/.github/workflows/trusted-release.yml --signer-digest "$stage_digest" --source-ref refs/heads/main --deny-self-hosted-runners
          python3 -c 'import json,os,sys; r=json.load(open(sys.argv[1])); assert r["acceptanceRunID"] == os.environ["QUALIFICATION_RUN"]' "$receipt"
          for file in "$bundle/source"/*; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" --signer-workflow hostwright/hostwright/.github/workflows/trusted-release.yml --signer-digest "$stage_digest" --source-ref refs/heads/main --deny-self-hosted-runners
          done
          python3 scripts/release/staged-release.py receipt --root "$bundle" --commit "$RELEASE_COMMIT" --version "$RELEASE_VERSION" --run "$STAGE_RUN" --attempt "$STAGE_ATTEMPT" --receipt "$receipt"

      - name: Independently reverify staged source signature and qualified runtime evidence
        shell: bash
        run: |
          set -euo pipefail
          gpg_arguments=()
          if [[ -n "$RELEASE_GPG" || -n "$RELEASE_GPG_SHA256" ]]; then
            [[ "$RELEASE_GPG" == /* && "$RELEASE_GPG_SHA256" =~ ^[a-f0-9]{64}$ ]]
            gpg_arguments=(--gpg "$RELEASE_GPG" --gpg-sha256 "$RELEASE_GPG_SHA256")
          fi
          python3 scripts/release/stage-corresponding-source.py verify --root "$RUNNER_TEMP/hostwright-publish-bundle" --commit "$RELEASE_COMMIT" --version "$RELEASE_VERSION" "${gpg_arguments[@]}"

      - name: Revalidate signed inventory before publication
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/hostwright-publish-bundle/release"
          formula="$RUNNER_TEMP/hostwright-publish-bundle/Formula/hostwright.rb"
          test -d "$release_dir"
          test -f "$formula"
          test "$(find "$release_dir" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" = 12
          test "$(find "$release_dir" -mindepth 1 -maxdepth 1 ! -type f | wc -l | tr -d ' ')" = 0
          (cd "$release_dir" && /usr/bin/shasum -a 256 -c SHA256SUMS)
          security cms -D -i "$release_dir/release-manifest.json.cms" \
            -c "$release_dir/release-manifest.json" -n -h 15 -u 6 >/dev/null
          security cms -D -i "$release_dir/SHA256SUMS.cms" \
            -c "$release_dir/SHA256SUMS" -n -h 15 -u 6 >/dev/null
          security cms -D -i "$release_dir/provenance.intoto.json.cms" \
            -c "$release_dir/provenance.intoto.json" -n -h 15 -u 6 >/dev/null
          security cms -D -i "$release_dir/release-evidence.json.cms" \
            -c "$release_dir/release-evidence.json" -n -h 15 -u 6 >/dev/null
          brew ruby -- -c "$formula"

      - name: Publish immutable qualified release
        shell: bash
        run: |
          set -euo pipefail
          ownership_file="$RUNNER_TEMP/hostwright-publication-ownership-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$ownership_file"
          ownership_marker="$(/usr/bin/uuidgen)"
          [[ "$ownership_marker" =~ ^[A-F0-9-]{36}$ ]]
          umask 077
          printf '%s\n' "$ownership_marker" > "$ownership_file"
          tag_message="Hostwright $RELEASE_VERSION trusted qualified release
          hostwright-release-ownership:$ownership_marker"
          tag_object="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="$RELEASE_TAG" \
            -f message="$tag_message" \
            -f object="$RELEASE_COMMIT" \
            -f type=commit \
            --jq .sha)"
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$RELEASE_TAG" \
            -f sha="$tag_object" >/dev/null
          channel_flags=()
          if [[ "$RELEASE_VERSION" != 0.0.2 ]]; then channel_flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/hostwright-publish-bundle/release"/* \
            "$RUNNER_TEMP/hostwright-publish-bundle/Formula/hostwright.rb" \
            "$RUNNER_TEMP/hostwright-publish-bundle/source"/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_COMMIT" \
            --title "Hostwright $RELEASE_VERSION" \
            --notes "Qualified Hostwright $RELEASE_VERSION; exact staged artifacts.
          hostwright-release-ownership:$ownership_marker" \
            "${channel_flags[@]}" \
            --verify-tag

      - name: Verify bytes downloaded from the published release
        shell: bash
        run: |
          set -euo pipefail
          download="$RUNNER_TEMP/hostwright-release-download-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir "$download"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$download"
          expected="$RUNNER_TEMP/hostwright-publish-bundle"
          diff \
            <({ find "$expected/release" -mindepth 1 -maxdepth 1 -type f -exec basename {} \;; basename "$expected/Formula/hostwright.rb"; find "$expected/source" -mindepth 1 -maxdepth 1 -type f -exec basename {} \;; } | sort) \
            <(find "$download" -mindepth 1 -maxdepth 1 -type f -exec basename {} \; | sort)
          for original in "$expected/release"/* "$expected/Formula/hostwright.rb" "$expected/source"/*; do
            cmp "$original" "$download/$(basename "$original")"
          done
          (cd "$download" && /usr/bin/shasum -a 256 -c SHA256SUMS && /usr/bin/shasum -a 256 -c SOURCE_SHA256SUMS)
          security cms -D -i "$download/release-manifest.json.cms" \
            -c "$download/release-manifest.json" -n -h 15 -u 6 >/dev/null
          security cms -D -i "$download/SHA256SUMS.cms" \
            -c "$download/SHA256SUMS" -n -h 15 -u 6 >/dev/null
          security cms -D -i "$download/provenance.intoto.json.cms" \
            -c "$download/provenance.intoto.json" -n -h 15 -u 6 >/dev/null
          security cms -D -i "$download/release-evidence.json.cms" \
            -c "$download/release-evidence.json" -n -h 15 -u 6 >/dev/null
          archive_name="$(plutil -extract archive.fileName raw "$download/release-manifest.json")"
          package_name="$(plutil -extract package.fileName raw "$download/release-manifest.json")"
          gh attestation verify "$download/$archive_name" --repo "$GITHUB_REPOSITORY"
          gh attestation verify "$download/$package_name" --repo "$GITHUB_REPOSITORY"
          gh attestation verify "$download/hostwright.rb" --repo "$GITHUB_REPOSITORY"
          stage_digest="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["head_sha"])' "$RUNNER_TEMP/stage-run.json")"
          for original in "$expected/source"/*; do
            gh attestation verify "$download/$(basename "$original")" --repo "$GITHUB_REPOSITORY" --signer-workflow hostwright/hostwright/.github/workflows/trusted-release.yml --signer-digest "$stage_digest" --source-ref refs/heads/main --deny-self-hosted-runners
          done

      - name: Compensate a failed or cancelled publication
        if: ${{ failure() || cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          ownership_file="$RUNNER_TEMP/hostwright-publication-ownership-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ ! -f "$ownership_file" || -L "$ownership_file" ]]; then
            exit 0
          fi
          test "$(stat -f '%Lp' "$ownership_file")" = 600
          ownership_marker="$(cat "$ownership_file")"
          [[ "$ownership_marker" =~ ^[A-F0-9-]{36}$ ]]
          expected_tag_message="Hostwright $RELEASE_VERSION trusted qualified release
          hostwright-release-ownership:$ownership_marker"
          tag_ref="repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG"
          if ! tag_object_sha="$(gh api "$tag_ref" --jq '.object.sha' 2>/dev/null)"; then
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Refusing compensation: release exists without its exact owned tag." >&2
              exit 70
            fi
            exit 0
          fi
          tag_object_type="$(gh api "$tag_ref" --jq '.object.type')"
          test "$tag_object_type" = tag
          tag_name="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha" --jq '.tag')"
          tag_message="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha" --jq '.message')"
          resolved_type="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha" --jq '.object.type')"
          resolved_commit="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha" --jq '.object.sha')"
          if [[ "$tag_name" != "$RELEASE_TAG" || "$tag_message" != "$expected_tag_message" || "$resolved_type" != commit || "$resolved_commit" != "$RELEASE_COMMIT" ]]; then
            echo "Refusing compensation: tag ownership differs from the exact release commit." >&2
            exit 70
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,body,targetCommitish > "$RUNNER_TEMP/owned-release.json"
            python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["tagName"] == sys.argv[2] and r["targetCommitish"] == sys.argv[3] and r["body"].endswith("hostwright-release-ownership:" + sys.argv[4])' "$RUNNER_TEMP/owned-release.json" "$RELEASE_TAG" "$RELEASE_COMMIT" "$ownership_marker"
            gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi
          current_object_sha="$(gh api "$tag_ref" --jq '.object.sha')"
          current_commit="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$current_object_sha" --jq '.object.sha')"
          if [[ "$current_object_sha" != "$tag_object_sha" || "$current_commit" != "$RELEASE_COMMIT" ]]; then
            echo "Refusing compensation: tag changed before deletion." >&2
            exit 70
          fi
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG"
