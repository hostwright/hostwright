name: Documentation and website

on:
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "examples/**"
      - "schemas/**"
      - "contracts/**"
      - "scripts/check-*.py"
      - "scripts/check-docs.sh"
      - ".github/workflows/docs-site.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs-site-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core-documentation:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate current docs, links, and quickstarts
        run: scripts/check-docs.sh
