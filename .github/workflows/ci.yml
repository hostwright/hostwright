name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  latest-macos-build:
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      HOSTWRIGHT_CI_SWIFT_INPUT_HASHING: 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify latest macOS toolchain environment
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(sw_vers -productVersion)" == 27.* ]] || exit 1
          [[ "$(uname -m)" == arm64 ]] || exit 1
          xcodebuild -version
          swift --version
      - name: Compute the SwiftPM cache key
        id: toolchain
        shell: bash
        env:
          SWIFTPM_LOCK_HASH: ${{ hashFiles('Package.resolved') }}
        run: scripts/ci-swift-toolchain-key.sh
      - name: Restore SwiftPM build output
        id: swift-cache
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ steps.toolchain.outputs.key }}
          restore-keys: ${{ steps.toolchain.outputs.prefix }}
      - name: Build the package
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          scripts/ci-swift.sh build --jobs 3
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Save SwiftPM build output
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && steps.swift-cache.outputs.cache-hit != 'true')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ steps.toolchain.outputs.key }}
      - name: Exercise the Docker proxy process
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-docker-proxy.py "$(swift build --show-bin-path)/hostwright-docker-proxy"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  test:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      HOSTWRIGHT_CI_SWIFT_INPUT_HASHING: 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Enforce Swift source file sizes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ ! "$BASE_SHA" =~ ^[a-f0-9]{40}$ || "$BASE_SHA" == 0000000000000000000000000000000000000000 ]]; then
            echo 'A valid base commit is required for the Swift size check.' >&2
            exit 1
          fi
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          python3 scripts/check-swift-source-file-sizes.py --base "$BASE_SHA"
          python3 scripts/test-swift-source-file-sizes.py
      - name: Select pull-request checks
        id: check-scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          scope="$(python3 scripts/ci-check-scope.py --event "$EVENT_NAME" --base "$BASE_SHA" --head "$HEAD_SHA")"
          python3 scripts/test-ci-check-scope.py
          run_regression=false
          run_native_reuse=false
          run_docs_qualification=false
          case "$scope" in
            full) run_regression=true ;;
            native-reuse) run_native_reuse=true ;;
            native-reuse-docs) run_native_reuse=true; run_docs_qualification=true ;;
            docs-qualification) run_docs_qualification=true ;;
            *) exit 1 ;;
          esac
          {
            printf 'run_regression=%s\n' "$run_regression"
            printf 'run_native_reuse=%s\n' "$run_native_reuse"
            printf 'run_docs_qualification=%s\n' "$run_docs_qualification"
          } >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == pull_request || "$EVENT_NAME" == push ]] \
            && [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] \
            && [[ "$BASE_SHA" != 0000000000000000000000000000000000000000 ]] \
            && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null \
            && git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git diff --check
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.check-scope.outputs.run_regression == 'true'
        with:
          go-version: 1.26.5
          cache: ${{ github.event_name == 'pull_request' }}
          cache-dependency-path: Guest/HostwrightNetfilter/go.sum
      - name: Guest network-policy loader
        if: steps.check-scope.outputs.run_regression == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd Guest/HostwrightNetfilter
          test -z "$(gofmt -l .)"
          GOTOOLCHAIN=local go test ./...
          GOTOOLCHAIN=local GOOS=linux GOARCH=arm64 CGO_ENABLED=0 \
            go test -c -mod=readonly -trimpath \
            -o "$RUNNER_TEMP/hostwright-netfilter-tests"
          for build in first second; do
            GOTOOLCHAIN=local GOOS=linux GOARCH=arm64 CGO_ENABLED=0 \
              go build -mod=readonly -trimpath -buildvcs=false \
              -gcflags=all=-buildid= \
              -ldflags="-buildid= -s -w" \
              -o "$RUNNER_TEMP/hostwright-netfilter-$build" .
          done
          cmp \
            "$RUNNER_TEMP/hostwright-netfilter-first" \
            "$RUNNER_TEMP/hostwright-netfilter-second"
          file "$RUNNER_TEMP/hostwright-netfilter-first" \
            | grep -F "ELF 64-bit LSB executable, ARM aarch64"
          (
            cd "$RUNNER_TEMP"
            shasum -a 256 hostwright-netfilter-first \
              >hostwright-netfilter-linux-arm64.sha256
          )
      - name: Retain guest policy loader for live qualification
        if: steps.check-scope.outputs.run_regression == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hostwright-netfilter-linux-arm64
          path: |
            ${{ runner.temp }}/hostwright-netfilter-first
            ${{ runner.temp }}/hostwright-netfilter-linux-arm64.sha256
          retention-days: 1
          if-no-files-found: error
      - name: Compute the SwiftPM cache key
        id: toolchain
        if: steps.check-scope.outputs.run_regression == 'true' || steps.check-scope.outputs.run_docs_qualification == 'true'
        shell: bash
        env:
          SWIFTPM_LOCK_HASH: ${{ hashFiles('Package.resolved') }}
          SWIFTPM_CACHE_NAMESPACE: spm-v1-tests
        run: scripts/ci-swift-toolchain-key.sh
      - name: Restore SwiftPM build output
        id: swift-cache
        if: (github.event_name == 'pull_request' && steps.check-scope.outputs.run_regression == 'true') || steps.check-scope.outputs.run_docs_qualification == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ steps.toolchain.outputs.key }}
          restore-keys: ${{ steps.toolchain.outputs.prefix }}
      - name: Build the package
        if: steps.check-scope.outputs.run_regression == 'true'
        shell: bash
        env:
          HOSTWRIGHT_TEST_RESULTS_DIR: ${{ runner.temp }}/hostwright-test-results
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          mkdir -p "$HOSTWRIGHT_TEST_RESULTS_DIR"
          scripts/test.sh pr-build 2>&1 | tee "$HOSTWRIGHT_TEST_RESULTS_DIR/pr.log"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Save SwiftPM build output
        if: steps.check-scope.outputs.run_regression == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && steps.swift-cache.outputs.cache-hit != 'true'))
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ steps.toolchain.outputs.key }}
      - name: Pull-request regression gate
        if: steps.check-scope.outputs.run_regression == 'true'
        shell: bash
        env:
          HOSTWRIGHT_TEST_RESULTS_DIR: ${{ runner.temp }}/hostwright-test-results
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          mkdir -p "$HOSTWRIGHT_TEST_RESULTS_DIR"
          scripts/test.sh pr-tests 2>&1 \
            | tee -a "$HOSTWRIGHT_TEST_RESULTS_DIR/pr.log"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Build the recording-runtime test flavor
        if: github.event_name == 'pull_request' && steps.check-scope.outputs.run_regression == 'true'
        shell: bash
        env:
          HOSTWRIGHT_TEST_RUNTIME: '1'
        run: |
          python3 scripts/check-test-runtime-artifact.py --self-test
          scripts/ci-swift.sh build --jobs 3 --build-tests
      - name: Run the simulated cluster and recording-runtime tests
        if: github.event_name == 'pull_request' && steps.check-scope.outputs.run_regression == 'true'
        timeout-minutes: 3
        shell: bash
        env:
          HOSTWRIGHT_TEST_RUNTIME: '1'
          HOSTWRIGHT_TEST_RESULTS_DIR: ${{ runner.temp }}/hostwright-test-results
        run: |
          set -euo pipefail
          scripts/ci-swift.sh test --jobs 3 --skip-build \
            --filter 'SimulatedClusterHarnessTests|TestRuntimeFlavorTests' \
            --xunit-output "$HOSTWRIGHT_TEST_RESULTS_DIR/recording-runtime.xml" \
            2>&1 | tee "$HOSTWRIGHT_TEST_RESULTS_DIR/recording-runtime.log"
          grep -F "Test Suite 'SimulatedClusterHarnessTests' passed" "$HOSTWRIGHT_TEST_RESULTS_DIR/recording-runtime.log"
          grep -F "Test Suite 'TestRuntimeFlavorTests' passed" "$HOSTWRIGHT_TEST_RESULTS_DIR/recording-runtime.log"
      - name: Documentation qualification regressions
        if: steps.check-scope.outputs.run_docs_qualification == 'true'
        shell: bash
        env:
          HOSTWRIGHT_TEST_RESULTS_DIR: ${{ runner.temp }}/hostwright-test-results
        run: |
          set -euo pipefail
          mkdir -p "$HOSTWRIGHT_TEST_RESULTS_DIR"
          log="$HOSTWRIGHT_TEST_RESULTS_DIR/qualification-docs.log"
          passing=testDocumentationLaneProducesExactNonPromotableOrPassingEvidence
          stale=testDocumentationLaneMarksEvidenceStaleWhenTrackedSourceChangesDuringExecution
          scripts/ci-swift.sh test --jobs 3 --disable-swift-testing \
            --filter "ReleaseQualificationCLITests/($passing|$stale)$" 2>&1 | tee "$log"
          for test_case in "$passing" "$stale"; do
            grep -F "ReleaseQualificationCLITests $test_case]' passed" "$log"
          done
      - name: Native runtime provenance regressions
        if: steps.check-scope.outputs.run_native_reuse == 'true'
        shell: bash
        env:
          HOSTWRIGHT_TEST_RESULTS_DIR: ${{ runner.temp }}/hostwright-test-results
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          mkdir -p "$HOSTWRIGHT_TEST_RESULTS_DIR"
          {
            python3 scripts/release/test-native-runtime-reuse.py
            python3 scripts/release/test-runtime-ingredient-gates.py
            python3 scripts/release/test-prepare-runtime-provenance.py
            python3 scripts/release/test-runtime-provenance.py
            python3 scripts/release/test-verify-sdk-reuse.py
          } 2>&1 | tee "$HOSTWRIGHT_TEST_RESULTS_DIR/pr.log"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Retain pull-request logs and results
        if: ${{ always() && (steps.check-scope.outputs.run_regression == 'true' || steps.check-scope.outputs.run_native_reuse == 'true' || steps.check-scope.outputs.run_docs_qualification == 'true') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hostwright-test-results
          retention-days: 7
          if-no-files-found: warn

  runtime-provenance:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: false
      - name: Verify the shipped guest modules match corresponding-source pins
        run: |
          python3 scripts/check-go-source-pins.py --self-test
          python3 scripts/check-go-source-pins.py
      - name: Verify source and build evidence capture
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang lld llvm ninja-build strace
          python3 scripts/release/test-capture-runtime-source.py
          python3 scripts/release/test-capture-linux-runtime-source.py
          python3 scripts/release/test-capture-package-sources.py
          python3 scripts/release/test-capture-go-runtime-sources.py
          python3 scripts/release/test-capture-go-build.py
          python3 scripts/release/test-prepare-go-runtime-provenance.py
          python3 scripts/release/test-capture-native-runtime-build.py
          python3 scripts/release/test-capture-native-source-map.py
          python3 scripts/release/test-capture-native-patches.py
          python3 scripts/release/test-kernel-source-extraction.py
          python3 scripts/release/test-capture-swift-sdk-build-inputs.py
          python3 scripts/release/test-capture-sdk-object-sources.py
          python3 scripts/release/test-sdk-build-checkpoint.py
          python3 scripts/release/test-sdk-checkpoint-workflow.py
          python3 scripts/release/test-sdk-native-carrier.py
          python3 scripts/release/test-verify-sdk-reuse.py
          python3 scripts/release/test-recover-sdk-object-sources.py
          python3 scripts/release/test-prepare-native-source-projects.py
          python3 scripts/release/test-prepare-reviewed-native-sources.py
          python3 scripts/release/test-prepare-native-runtime-provenance.py
          python3 scripts/release/test-prepare-runtime-provenance.py
          python3 scripts/release/test-runtime-provenance.py
          python3 scripts/release/test-assemble-runtime-provenance.py
          python3 scripts/release/test-create-runtime-rootfs.py
          python3 scripts/release/test-create-runtime-oci.py
          python3 scripts/release/test-prepare-runtime-attestation-subjects.py
          python3 scripts/release/test-materialize-runtime-assets.py
          python3 scripts/release/test-qualify-runtime-inventory.py
          python3 scripts/release/test-runtime-ingredient-gates.py
          python3 scripts/release/test-loader-inventory-update.py
          python3 scripts/release/test-corresponding-source.py
          python3 scripts/release/test-stage-corresponding-source.py
