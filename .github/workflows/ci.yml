name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Guest network-policy loader
        shell: bash
        run: |
          set -euo pipefail
          cd Guest/HostwrightNetfilter
          test -z "$(gofmt -l .)"
          GOTOOLCHAIN=local go test ./...
          GOTOOLCHAIN=local GOOS=linux GOARCH=arm64 CGO_ENABLED=0 \
            go test -c -mod=readonly -trimpath \
            -o "$RUNNER_TEMP/hostwright-netfilter-tests"
          for build in first second; do
            GOTOOLCHAIN=local GOOS=linux GOARCH=arm64 CGO_ENABLED=0 \
              go build -mod=readonly -trimpath -buildvcs=false \
              -ldflags="-buildid= -s -w" \
              -o "$RUNNER_TEMP/hostwright-netfilter-$build" .
          done
          cmp \
            "$RUNNER_TEMP/hostwright-netfilter-first" \
            "$RUNNER_TEMP/hostwright-netfilter-second"
          file "$RUNNER_TEMP/hostwright-netfilter-first" \
            | grep -F "ELF 64-bit LSB executable, ARM aarch64"
      - name: Local integration
        run: scripts/integration.sh
      - name: Roadmap governance
        run: |
          python3 scripts/roadmap-governance.py validate
          python3 scripts/roadmap-governance.py self-test
          python3 scripts/render-roadmap-index.py check
          python3 scripts/check-current-truth.py
      - name: Lint
        run: scripts/lint.sh
      - name: Naming scan
        run: scripts/grep-orchard.sh .
